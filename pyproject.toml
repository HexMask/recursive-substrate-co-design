[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rscd-generation-zero"
version = "0.1.0"
description = "A small, toy-scale substrate search seed for RSCD."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Holbert"}]

[project.scripts]
rscd-gen0 = "rscd_gen0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
